[project]
name = "operations-assistant"
version = "0.1.0"
description = "Investigation assistant over Northstar Manufacturing's operational data and policy documents."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
